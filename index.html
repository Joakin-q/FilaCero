<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilaCero - Login</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="card">

        <!-- LOGIN -->
        <div id="loginBox">

            <h1>FilaCero</h1>
            <p>Iniciar sesión</p>

            <form id="loginForm">
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Correo electrónico"
                        required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Contraseña"
                        required>
                    <i class="fa-solid fa-eye eye" id="eyeLogin"></i>
                </div>

                <button type="submit" id="btnLogin">
                    Iniciar Sesión
                </button>
            </form>

            <a href="#" id="forgotPassword">
                ¿Olvidaste tu contraseña?
            </a>

            <hr>

            <p>
                ¿No tienes cuenta?
                <span id="showRegister" class="toggle-link">
                    Registrarse
                </span>
            </p>

        </div>

        <!-- REGISTRO -->
        <div id="registerBox" class="hidden">

            <h1>Crear Cuenta</h1>
            <p>Completa tus datos</p>

            <form id="registerForm">
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input
                        type="text"
                        id="nombre"
                        placeholder="Nombre"
                        required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input
                        type="text"
                        id="apellido"
                        placeholder="Apellido"
                        required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Correo electrónico"
                        required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Contraseña"
                        required>
                    <i class="fa-solid fa-eye eye" id="eyeRegister"></i>
                </div>

                <button type="submit" id="btnRegister">
                    Registrarse
                </button>
            </form>

            <hr>

            <p>
                ¿Ya tienes cuenta?
                <span id="showLogin" class="toggle-link">
                    Iniciar sesión
                </span>
            </p>

        </div>

    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
