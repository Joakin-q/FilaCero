<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | FilaCero</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>Crear Cuenta</h2>
        <p class="subtitle">Regístrate para gestionar tus turnos</p>

        <form id="registerForm">
            <div class="field">
                <input type="text" id="name" placeholder="Nombre completo" required>
            </div>
            <div class="field">
                <input type="email" id="email" placeholder="Correo electrónico" required>
            </div>
            <div class="field">
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>
            <div class="field">
                <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required>
            </div>
            <button type="submit" class="btn-main">Registrarse</button>
        </form>

        <a href="login.html" class="link-register">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
    <script src="../js/auth.js"></script>
</body>
</html>
