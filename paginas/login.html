<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | FilaCero</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="logo-box">
            <img src="../assets/images/filacero_logo.png" alt="FilaCero">
        </div>
        
        <h2>Bienvenido</h2>
        <p class="subtitle">Ingresá tus datos para continuar</p>

        <form id="loginForm">
            <div class="field">
                <input type="email" id="email" placeholder="Correo electrónico" required>
            </div>
            <div class="field">
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-main">Iniciar sesión</button>
        </form>

        <a href="registro.html" class="link-register">¿No tienes cuenta? Regístrate</a>
    </div>
    <script src="../js/auth.js"></script>
</body>
</html>
