<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A2E">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpeg">
  <title>Crear cuenta · FilaCero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>

<div class="auth-screen">
  <div class="auth-panel">
    <div style="width: 100%; max-width: 380px;">
      <a class="back-link" href="login.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Volver al login
      </a>
      <div class="auth-logo">
        <img src="../../assets/images/logo.jpeg" alt="FilaCero">
        <div class="name">FilaCero</div>
      </div>

      <div class="auth-card">
        <h2>Crear cuenta</h2>
        <p class="subtitle">Empezá a gestionar tus turnos en minutos.</p>

        <div class="auth-error" id="authError"></div>

        <form id="registerForm" autocomplete="on">
          <div class="form-row-2col">
            <div class="field">
              <label for="nombre">Nombre</label>
              <input id="nombre" required placeholder="Juan">
            </div>
            <div class="field">
              <label for="apellido">Apellido</label>
              <input id="apellido" required placeholder="Pérez">
            </div>
          </div>

          <div class="field">
            <label for="dni">DNI</label>
            <input id="dni" required inputmode="numeric" pattern="[0-9]{7,9}" placeholder="40123456">
          </div>

          <div class="field">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input id="fechaNacimiento" type="date" required>
          </div>

          <div class="field">
            <label for="telefono">Teléfono</label>
            <input id="telefono" type="tel" placeholder="+54 11 5555-0000">
          </div>

          <div class="field">
            <label for="obraSocial">Obra social</label>
            <input id="obraSocial" placeholder="OSDE, Swiss Medical, etc.">
          </div>

          <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" required autocomplete="email" placeholder="tu@correo.com">
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" required autocomplete="new-password" minlength="4" placeholder="Mínimo 4 caracteres">
          </div>

          <button class="btn btn-primary btn-block" type="submit">Crear mi cuenta</button>
        </form>

        <div class="auth-foot" style="margin-top: 14px;">
          ¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="fc-modal"></div>

<script src="../../js/config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../js/data/firebase.js"></script>
<script src="../../js/data/db.js"></script>
<script src="../../js/auth/auth.js"></script>
<script src="../../js/utils/utils.js"></script>
``
<script>
  // Si ya hay sesión, redirigir (esto sí debe funcionar)
  const s = window.FC_AUTH.getSession();
  if (s) {
    window.location.href = s.rol === 'admin' ? '../admin/dashboard.html' : '../paciente/inicio.html';
  }

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const form = e.target;
    const errorBox = document.getElementById('authError');
    const submitBtn = form.querySelector('button[type="submit"]');

    const showError = (msg) => {
      errorBox.textContent = msg;
      errorBox.classList.add('is-visible');
    };

    errorBox.textContent = '';
    errorBox.classList.remove('is-visible');

    const userData = {
      nombre: form.nombre.value.trim(),
      apellido: form.apellido.value.trim(),
      dni: form.dni.value.trim(),
      fechaNacimiento: form.fechaNacimiento.value,
      telefono: form.telefono.value.trim(),
      obraSocial: form.obraSocial.value.trim(),
      email: form.email.value.trim(),
      password: form.password.value,
    };

    submitBtn.disabled = true;
    const originalText = submitBtn.textContent;
    submitBtn.textContent = 'Creando cuenta...';

    try {
      const session = await window.FC_AUTH.registerPaciente(userData);
      window.location.href = session.rol === 'admin' ? '../admin/dashboard.html' : '../paciente/inicio.html';
    } catch (error) {
      const messages = {
        EMAIL_EN_USO: 'Este correo electrónico ya está registrado.',
        PASSWORD_DEBIL: 'La contraseña es demasiado débil.',
      };
      showError(messages[error.message] || `${error.code || ''} ${error.message || 'Error al crear la cuenta'}`);
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    }
  });
</script>
</body>
</html>
