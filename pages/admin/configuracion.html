<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A2E">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpeg">
  <title>Configuración · FilaCero Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

<div class="app-shell">

  <aside class="desktop-sidebar" id="fc-sidebar"></aside>

  <div class="desktop-main">
    <header class="desktop-topbar" id="fc-topbar"></header>

    <main class="desktop-content">
      <div class="desktop-content-inner">

        <div class="admin-page">
          <div class="admin-page-header">
            <div>
              <h1>Configuración del centro</h1>
              <p>Datos institucionales que se muestran en toda la app.</p>
            </div>
          </div>

          <form id="centroForm" class="panel" style="max-width:760px;">
            <h2>Datos institucionales</h2>
            <p class="panel-sub">Estos datos aparecen en la cabecera, emails y comprobantes.</p>

            <div class="form-grid">
              <div class="field field--full">
                <label>Nombre institucional</label>
                <input name="nombre" required placeholder="Ej: Centro Médico FilaCero">
              </div>
              <div class="field field--full">
                <label>Dirección</label>
                <input name="direccion" placeholder="Calle, número, ciudad">
              </div>
              <div class="field">
                <label>Teléfono</label>
                <input name="telefono" placeholder="+54 11 4000-0000">
              </div>
              <div class="field">
                <label>Email</label>
                <input type="email" name="email" placeholder="contacto@centro.com">
              </div>
              <div class="field field--full">
                <label>Horario de atención</label>
                <input name="horario" placeholder="Ej: Lunes a Viernes de 8:00 a 20:00">
              </div>

              <div class="field field--full">
                <label>Logo</label>
                <div class="logo-upload">
                  <div class="logo-preview" id="logoPreview">
                    <img id="logoImg" alt="Logo" style="display:none;">
                    <span id="logoPlaceholder" style="color:var(--color-text-muted); font-size:11px;">Sin logo</span>
                  </div>
                  <div>
                    <label class="upload-btn" for="logoInput">Subir imagen</label>
                    <input id="logoInput" type="file" accept="image/*">
                    <div class="hint">PNG, JPG o SVG. Máx ~500KB.</div>
                    <button type="button" class="btn btn-outline btn-outline--danger" id="btnQuitarLogo" style="margin-top:6px; font-size:11px; padding:6px 12px;">Quitar logo</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-actions" style="margin-top:20px;">
              <button type="button" class="btn btn-outline" id="btnReset">Restablecer</button>
              <button type="submit" class="btn btn-primary">Guardar cambios</button>
            </div>
          </form>

        </div>

      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="fc-bottom-nav"></nav>
</div>

<div class="modal-backdrop" id="fc-modal"></div>

<script src="../../js/config.js"></script>
<script src="../../js/data/repository.js"></script>
<script src="../../js/auth/auth.js"></script>
<script src="../../js/utils/utils.js"></script>
<script src="../../js/admin/configuracion.js"></script>
</body>
</html>
