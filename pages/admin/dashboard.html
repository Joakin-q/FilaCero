<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A2E">
  <title>Dashboard · FilaCero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <style>
    body { background: var(--color-bg); }
    .placeholder {
      min-height: 100vh;

      flex-direction: column;

<body>
  <div class="placeholder">
    <img src="../../assets/images/logo.jpeg" alt="FilaCero">
    <h1>Panel de administración</h1>
    <p>Esta sección la desarrolla otro equipo del proyecto. Iniciaste sesión como administrador correctamente.</p>

</html>
