<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A2E">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpeg">
  <title>Inicio · FilaCero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/paciente.css">
</head>
<body>

<div class="app-shell">

  <aside class="desktop-sidebar" id="fc-sidebar"></aside>
  <div class="desktop-main">
    <header class="desktop-topbar" id="fc-topbar"></header>

    <main class="desktop-content">
      <div class="desktop-content-inner">

        <!-- Header móvil -->
        <header class="mobile-header">
          <div class="mobile-header__top">
            <div class="brand-tag">
              <img src="../../assets/images/logo.jpeg" alt="FilaCero">
              FILACERO
            </div>
            <span style="color: var(--color-text-inverse-muted); cursor: default;" aria-label="Perfil">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
            </span>
          </div>
          <h1 id="welcomeTitle">Hola 👋</h1>
          <p>Acá tenés el resumen de tus turnos.</p>
        </header>

        <!-- CTA pedir turno -->
        <div class="welcome-card">
          <h2>¿Necesitás un turno?</h2>
          <p>Reservá en pocos pasos, sin llamadas ni esperas.</p>
          <button type="button" class="cta">
            Pedir turno ahora
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-card"><strong id="statTotal">0</strong><span>Total</span></div>
          <div class="stat-card"><strong id="statProximos">0</strong><span>Próximos</span></div>
          <div class="stat-card"><strong id="statFinalizados">0</strong><span>Finalizados</span></div>
          <div class="stat-card"><strong id="statCancelados">0</strong><span>Cancelados</span></div>
        </div>

        <!-- Próximos turnos -->
        <div class="section-block">
          <h3>
            Próximos turnos
            <span style="color: var(--accent); cursor: default;">Ver todos →</span>
          </h3>
          <div id="proximosList" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="fc-bottom-nav"></nav>
</div>

<div class="modal-backdrop" id="fc-modal"></div>

<script src="../../js/config.js"></script>
<script src="../../js/data/db.js"></script>
<script src="../../js/auth/auth.js"></script>
<script src="../../js/utils/utils.js"></script>
<script src="../../js/utils/lock-ui.js"></script>
<script>
  (async () => {
    const session = window.FC_AUTH.requireAuth(['paciente']);
    if (!session) return;

    window.FC_UTIL.mountSidebar({ active: 'inicio', user: session });
    window.FC_UTIL.mountBottomNav('inicio');
    window.FC_UTIL.mountTopbar({ title: 'Inicio', user: session });

    const paciente = await window.FC_DB.findPacienteByUsuario(session.userId);
    if (paciente) {
      document.getElementById('welcomeTitle').textContent = `Hola, ${paciente.nombre} 👋`;
    }

    const turnos = await window.FC_DB.listTurnos(session.pacienteId);
    const stats = {
      total: turnos.length,
      proximos: turnos.filter(t => ['pendiente','confirmado','proximo'].includes(t.estado)).length,
      finalizados: turnos.filter(t => t.estado === 'asistido' || t.estado === 'completado').length,
      cancelados: turnos.filter(t => t.estado === 'cancelado').length
    };
    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statProximos').textContent = stats.proximos;
    document.getElementById('statFinalizados').textContent = stats.finalizados;
    document.getElementById('statCancelados').textContent = stats.cancelados;

    const proximos = turnos
      .filter(t => ['pendiente','confirmado','proximo'].includes(t.estado))
      .slice(0, 3);

    const list = document.getElementById('proximosList');
    if (proximos.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <h3>Sin turnos próximos</h3>
          <p>Pedí tu primer turno y empezá a gestionar tus consultas.</p>
        </div>
      `;
    } else {
      list.innerHTML = proximos.map(t => renderCard(t)).join('');
    }
  })();

  function renderCard(t) {
    const colorClass = window.FC_UTIL.avatarClassByEspecialidad(t.especialidadId);
    return `
      <article class="turno-card">
        <div class="turno-card__top">
          <div class="turno-avatar turno-avatar--${colorClass}">${t.iniciales}</div>
          <div class="turno-info">
            <div class="turno-specialty">${t.especialidad}</div>
            <div class="turno-doctor">Dr. ${t.medico}</div>
          </div>
          <svg class="turno-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="turno-meta">
          <span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            ${window.FC_UTIL.formatFechaCorta(t.fecha)}
          </span>
          <span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            ${t.hora}
          </span>
        </div>
        <div class="turno-bottom">
          <div class="turno-status turno-status--confirmado">
            <span class="status-dot status-dot--confirmado"></span>Confirmado
          </div>
          <div class="turno-actions">
            <button type="button" class="btn-outline">Reprogramar</button>
          </div>
        </div>
      </article>
    `;
  }
</script>
</body>
</html>
