<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A2E">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/jpeg" href="../../assets/images/logo.jpeg">
  <title>Notificaciones · FilaCero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/paciente.css">
  <style>
    .notif-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .notif-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .notif-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notif-icon--confirm { background: rgba(47, 158, 91, 0.12); color: var(--success); }
    .notif-icon--cancel  { background: rgba(224, 82, 76, 0.12); color: var(--danger); }
    .notif-icon--info    { background: rgba(47, 111, 237, 0.12); color: var(--accent); }
    .notif-body { flex: 1; min-width: 0; }
    .notif-msg {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-dark);
      line-height: 1.4;
    }
    .notif-time {
      font-size: 11px;
      color: var(--color-text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="app-shell">

  <aside class="desktop-sidebar" id="fc-sidebar"></aside>
  <div class="desktop-main">
    <header class="desktop-topbar" id="fc-topbar"></header>

    <main class="desktop-content">
      <div class="desktop-content-inner">

        <header class="mobile-header">
          <div class="mobile-header__top">
            <div class="brand-tag">
              <img src="../../assets/images/logo.jpeg" alt="FilaCero">
              FILACERO
            </div>
          </div>
          <h1>Notificaciones</h1>
          <p>Te avisamos cuando algo importante pasa con tus turnos.</p>
        </header>

        <div class="notif-list" id="notifList"></div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="fc-bottom-nav"></nav>
</div>

<div class="modal-backdrop" id="fc-modal"></div>

<script src="../../js/config.js"></script>
<script src="../../js/data/db.js"></script>
<script src="../../js/auth/auth.js"></script>
<script src="../../js/utils/utils.js"></script>
<script src="../../js/utils/lock-ui.js"></script>
<script>
  (async () => {
    const session = window.FC_AUTH.requireAuth(['paciente']);
    if (!session) return;

    window.FC_UTIL.mountSidebar({ active: 'avisos', user: session });
    window.FC_UTIL.mountBottomNav('avisos');
    window.FC_UTIL.mountTopbar({ title: 'Notificaciones', user: session });

    const notifs = await window.FC_DB.listNotificaciones(session.userId);
    const list = document.getElementById('notifList');

    if (notifs.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          </div>
          <h3>Sin notificaciones</h3>
          <p>Acá aparecerán los avisos sobre tus turnos.</p>
        </div>
      `;
      return;
    }

    list.innerHTML = notifs.map(n => {
      const tipo = n.mensaje.toLowerCase().includes('cancel')
        ? 'cancel'
        : (n.mensaje.toLowerCase().includes('confirm') || n.mensaje.toLowerCase().includes('fue')) ? 'confirm' : 'info';
      const icon = tipo === 'cancel'
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
        : tipo === 'confirm'
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
      const fecha = new Date(n.fecha).toLocaleString('es-AR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      return `
        <article class="notif-card">
          <div class="notif-icon notif-icon--${tipo}">${icon}</div>
          <div class="notif-body">
            <div class="notif-msg">${n.mensaje}</div>
            <div class="notif-time">${fecha}</div>
          </div>
        </article>
      `;
    }).join('');
  })();
</script>
</body>
</html>
